[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "save-token"
version = "0.1.0"
description = "CLI to query free AI web chats via browser automation"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["click>=8.0", "tomli>=2.0; python_version < '3.11'"]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov"]

[project.scripts]
save-token = "save_token.cli:main"
st = "save_token.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["save_token*"]
